<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagen de fondo como patrón</title>
    <style>
        body {
            background-image: url("imagenes/patron.svg");
            background-color: #cccccc;
            /* Por defecto, la imagen se repite en horizontal y en vertical. */
        }
    </style>
</head>
<body>
    <h1>Una imagen de fondo como patrón</h1>
    <p>Esta imagen pequeña se repite hasta cubrir el fondo de la página.</p>
    <p>Prueba a añadir background-repeat: no-repeat; a la regla de body.</p>
</body>
</html>

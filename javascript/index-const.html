    <script>

        // Precio de un producto
        let precio = 100;

        // Aplicar el IVA. El IVA es un valor que no debería cambiar en toda la ejecución de tu script

        // Actualizo el precio del producto
        precio = precio * IVA;
        console.log(precio);
        
        
        

    </script>

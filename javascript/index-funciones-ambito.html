<body>
    <script>
        function calcularIVA(precio) {
            let total = precio * 1.21;
            return total;
        }

        function calcularEdad(añoNacimiento) {
            // Le pasas tu año y te dice la edad actual
            let total = 2026 - añoNacimiento;
            return total; 
        }

        console.log(calcularIVA(100));
        console.log(calcularIVA(1000));

        console.log(calcularEdad(1982));
        console.log(calcularEdad(2004));
        

    </script>
</body>

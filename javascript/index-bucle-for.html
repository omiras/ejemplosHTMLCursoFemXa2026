<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        /**
         * Los bucles son estructuras de programación diseñadas para repetir un fragmento de código un número detemrinado de veces
         * 
         */

        // Este bucle se ejecutará 2 veces

        // A cada ejecución del bucle, se le llama
        // iteración


        for (let i = 0; i < 10; i++) {

            console.log("El valor de la variable de iteración es " + i);
        }

        console.log("He acabado.");

    </script>
</body>

</html>

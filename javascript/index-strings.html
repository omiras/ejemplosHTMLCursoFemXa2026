<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const palabra = "NO DEJAS QUE NADIE PISE TU ALFOMBRA CON ZAPATOS";
        // https://objetos-xlk.estaticos-marca.com/uploads/2025/03/26/16615057340129.jpeg

        console.log(palabra.length); // El tamaño del string

        // puedo acceder a cualquier carácter de forma individual a partir del índice del string
        console.log(palabra[0]); // "N"
        console.log(palabra[1]); // "O"
        console.log(palabra[2]); // " "

        // El método slice puedo indicar dos índices , para "rebanar" el string y quedarme con trocito
        console.log(palabra.slice(0, 3)); 

    </script>
</body>

</html>

    <script>
        // feridora: 90

        // Todavia no le han aplicado el 19% de IVA, y hay que aplicarlo para obtener el subtotal

        function calcularIva(precio) {
            return precio * 1.21;
        }

        let subtotal = 90 + 60 + 20;

        let subtotalIva = calcularIva(subtotal);
        console.log(subtotalIva);

        /** Calcular Hipoteca*/
        /*

            - cuantos años lo quieres amortizar

               - en función de todo los parametros RETORNAR una cuota mensual a pagar
            }
        * 
         */
        function sumar(a, b) {
            return a + b;
        }

        console.log(sumar(3, 5)); // 8
        console.log(sumar(-1, 1)); // 0
        console.log(sumar(5, 5)); // 10

        function calcularAreaRectangulo(base, altura) {
            let area = base * altura;
            return area;
        }

        console.log("El area de un rectangulo de anchura 10 y altura 20 es: ", calcularAreaRectangulo(10, 20));
        console.log("El area de un rectangulo de anchura 1 y altura 2 es: ", calcularAreaRectangulo(1, 2));

        function esPar(numero) {
            if (numero % 2 == 0) {
                return true;
            } else {
                return false;
            }
        }

        console.log(esPar(4)); // true
        console.log(esPar(5)); // false

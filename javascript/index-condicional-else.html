<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /**
         * Somos jóvenes, y nos gustaría ir a la discoteca.
         * El portero, solo nos va a dejar entrar si tenemos 18 años o más.
         * 
         * Escribe un programa que te permita entrar a la disco si tienes 18 años o más, y haz que el protero te dé un mensaje adecuado
         * 
         * - Si tienes 18 años el portero nos dirá: ¡Puedes pasar, joven!
         * - Si no eres mayor de edad, nos dirá : ¡Lo siento, eres menor de edad! No puedes pasar.
         * 
         **/

         let edad = 16;

         // El operador >= hace esta pregunta: ¿es el valor de la izquierda mayor o igual al valor de la derecha?
         if (edad >= 18) {
            console.log("¡Puedes pasar, joven!");
         } else {
            console.log("¡Lo siento, eres menor de edad! No puedes pasar.");
         }

         
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tienda Tech</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .product {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            max-width: 350px;
            margin: auto;
            text-align: center;
        }

        .product img {
            width: 100%;
            max-width: 300px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
        }

        .description {
            color: #555;
        }

        .button {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #222;
            color: white;
            font-size: 16px;
            margin-top: 15px;
        }

        .highlight {
            background-color: #fff3cd;
            padding: 10px;
            border-radius: 5px;
        }

        .expensive {
            color: red;
            border: 2px solid black;
        }

        .cheap {
            color: green;
            border: 5px solid blue;
        }

   
    </style>
</head>

<body>

    <header>
        <h1 id="page-title">Tienda Tech</h1>
        <p id="welcome-message">Los mejores productos tecnológicos</p>
    </header>

    <main>

        <div class="product">

            <img
                id="product-image"
                src=""
                width="300"
            >

            <h2 id="product-name">---</h2>

            <p id="product-price" class="price">---</p>

            <p id="product-description" class="description">
                ----
            </p>

            <p id="product-category">
                ---
            </p>

            <button class="button">
                Añadir al carrito
            </button>

        </div>

    </main>

    <script>

        // Prueba aquí tus instrucciones JavaScript




        const productOferta = {
          name: "Ratón inalámbrico",
    price: 235,
    image: "https://images.unsplash.com/photo-1527814050087-3793815479db",
    description: "Ratón inalámbrico con diseño ergonómico.",
    category: "Informática"

        };

    // Guardamos el nodo en la variable productName
    const productName = document.querySelector("#product-name");

    // Consultamos el valor de la propieda textContent
    console.log(productName.textContent);

    // Todo en uno
    console.log(document.querySelector("#product-name").textContent);

    // Mostrar el precio del producto
    console.log(document.querySelector(".price").textContent);

    // Como cargar la información de un objeto en mi plantilla HTML
    // Seleccionar nodo a nodo, y actualizar el propiedad .texTContent con la información del objeto
    document.querySelector("#product-name").textContent = productOferta.name;

    document.querySelector("#product-price").textContent = productOferta.price + " €";

    document.querySelector("#product-description").textContent = productOferta.description;

    document.querySelector("#product-category").textContent = "Categoría: " + productOferta.category;

    document.querySelector("#product-image").src = productOferta.image;

    // Si el productoOferta.precio es menor de 99 euros, aplicar la clase .cheap , en caso contrario, aplicar la clase .expansive

    if (productOferta.price < 100) {
        document.querySelector("#product-price").classList.add("cheap");
    } else {
        document.querySelector("#product-price").classList.add("expensive");
    }

    </script>

</body>

</html>
